[package]
name = "incognitus"
version = "0.5.0"
description = "Incognitus — anonimização de PDFs em lote com o motor do Graphé"
edition = "2021"
publish = false

[lib]
name = "incognitus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
# o plugin `anonimizacao`: a fila de PDFs, os sidecars, o PDF anonimizado, a reidentificação, o motor e os Ajustes
tauri-plugin-anonimizacao = { path = "../plugin" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[dev-dependencies]
# os testes montam o app num runtime de mentira (tauri::test), sem abrir janela
tauri = { version = "2", features = ["test"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
