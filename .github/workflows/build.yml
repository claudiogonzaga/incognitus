# Incognitus — .dmg (macOS universal: Apple Silicon e Intel) e .msi (Windows x64), sem assinatura digital por ora
# (ver "Como abrir" no README). Roda à mão (Actions → build → Run workflow) ou com uma tag v*; com tag, e só se os
# dois sistemas passarem, os instaladores vão para a release mais nova, junto com o código-fonte do poppler (GPL).
name: build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - nome: macos-universal
            os: macos-15
            alvo: universal-apple-darwin
            pacote: dmg
            sidecars: mac
          - nome: windows-x64
            os: windows-latest
            alvo: x86_64-pc-windows-msvc
            pacote: msi
            sidecars: windows
    name: ${{ matrix.nome }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.sidecars == 'mac' && 'aarch64-apple-darwin,x86_64-apple-darwin' || 'x86_64-pc-windows-msvc' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: cache das ferramentas (conda-forge e micromamba)
        uses: actions/cache@v4
        with:
          path: .ferramentas
          key: ferramentas-${{ matrix.sidecars }}-${{ hashFiles('scripts/sidecars.py') }}

      - run: npm ci

      - name: o motor passa nos casos embutidos
        run: node scripts/regressao_motor.cjs motor/motor.js --casos src/motor/casos.json

      - name: sidecars (poppler, tesseract) e licenças
        shell: bash
        run: |
          python -m pip install -q pefile pymupdf reportlab pillow
          python scripts/sidecars.py ${{ matrix.sidecars }}

      - name: os sidecars funcionam (sem o app, como o Rust os chama)
        env:
          PYTHONIOENCODING: utf-8
        run: python testes/diag_sidecars.py

      - name: testes do Rust
        if: matrix.sidecars == 'mac'
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: build
        run: npx tauri build --target ${{ matrix.alvo }} --bundles ${{ matrix.sidecars == 'mac' && 'app,dmg' || 'msi' }}

      - uses: actions/upload-artifact@v4
        with:
          name: incognitus-${{ matrix.nome }}
          path: |
            src-tauri/target/${{ matrix.alvo }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.alvo }}/release/bundle/msi/*.msi
          if-no-files-found: error

      - name: teste de ponta a ponta no Incognitus.app empacotado (3 PDFs fictícios)
        if: matrix.sidecars == 'mac'
        env:
          PYTHONIOENCODING: utf-8
          SKIA_TESTE_DIR: ${{ runner.temp }}/skia-testes
        run: |
          python testes/e2e.py "src-tauri/target/${{ matrix.alvo }}/release/bundle/macos/Incognitus.app/Contents/MacOS/incognitus"

      - name: instalar o .msi e rodar o teste de ponta a ponta no app instalado (3 PDFs fictícios)
        if: matrix.sidecars == 'windows'
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
          SKIA_TESTE_DIR: ${{ runner.temp }}/skia-testes
        run: |
          $msi = Get-ChildItem "src-tauri/target/${{ matrix.alvo }}/release/bundle/msi/*.msi" | Select-Object -First 1
          Start-Process msiexec.exe -Wait -ArgumentList "/i `"$($msi.FullName)`" /qn /norestart /l*v msi.log"
          $exe = Get-ChildItem -Path "$env:ProgramFiles", "$env:LOCALAPPDATA\Programs" -Recurse -Filter incognitus.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { Get-Content msi.log -Tail 60; throw "o .msi não instalou o incognitus.exe" }
          Write-Host "instalado em $($exe.FullName)"
          python testes/e2e.py $exe.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }


      - name: o que o teste de ponta a ponta deixou (só se falhou; dados fictícios)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.nome }}
          path: |
            ${{ runner.temp }}/skia-testes/saida/*.json
            ${{ runner.temp }}/skia-testes/saida/*.log
          if-no-files-found: ignore

      - name: código-fonte do poppler (GPL), para acompanhar os instaladores
        if: matrix.sidecars == 'mac'
        run: curl -sSL --fail -o poppler-25.02.0.tar.xz https://poppler.freedesktop.org/poppler-25.02.0.tar.xz

      - uses: actions/upload-artifact@v4
        if: matrix.sidecars == 'mac'
        with:
          name: codigo-fonte-poppler
          path: poppler-25.02.0.tar.xz

  # A release sai SÓ quando os dois sistemas passam (build + teste de ponta a ponta), com os dois instaladores juntos.
  # Antes, cada sistema publicava o seu ao terminar, e a "latest" ficava uns minutos só com um deles (na 0.4.1, o link
  # do Mac deu 502 até o portal passar a buscar a release mais nova que tem o arquivo).
  # O link que não muda: …/releases/latest/download/Incognitus-macOS.dmg e …/Incognitus-Windows.msi apontam sempre
  # para a versão mais nova (os arquivos com o número da versão vão junto, para o histórico).
  publicar:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artefatos
          merge-multiple: true

      - name: instaladores com nome fixo
        shell: bash
        run: |
          ls -la artefatos
          mkdir -p fixos
          cp artefatos/*.dmg fixos/Incognitus-macOS.dmg
          cp artefatos/*.msi fixos/Incognitus-Windows.msi
          ls -la fixos

      - name: release publicada, a mais nova
        uses: softprops/action-gh-release@v2
        with:
          name: Incognitus ${{ github.ref_name }}
          make_latest: true
          files: |
            fixos/*
            artefatos/*
