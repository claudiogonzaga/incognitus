# Diagnóstico rápido dos sidecars no Windows (sem compilar o app): monta poppler/tesseract e os chama como o Rust chama.
name: diag-windows

on:
  workflow_dispatch:

jobs:
  sidecars:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: .ferramentas
          key: ferramentas-windows-${{ hashFiles('scripts/sidecars.py') }}
      - name: sidecars
        shell: bash
        run: |
          python -m pip install -q pefile pymupdf reportlab pillow
          python scripts/sidecars.py windows
          ls src-tauri/binaries src-tauri/recursos/win/lib | head -80
      - name: diagnóstico
        env:
          PYTHONIOENCODING: utf-8
        run: python testes/diag_sidecars.py
