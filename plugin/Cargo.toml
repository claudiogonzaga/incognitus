[package]
name = "tauri-plugin-anonimizacao"
version = "0.8.1"
description = "Incognitus como plugin do Tauri: anonimização de PDFs em lote com o motor do Graphé e reidentificação de minutas (o app Incognitus e o módulo do Graphé Desktop)"
edition = "2021"
publish = false
links = "tauri-plugin-anonimizacao"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ed25519-dalek = "2"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
pdf-writer = "0.12"
subsetter = "0.2"
ttf-parser = "0.25"
flate2 = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
getrandom = "0.2"
# macros e rt-multi-thread só servem aos testes; ficam aqui porque o CI testa o plugin pelo Cargo.toml do app, e
# dependência só de teste não vale em pacote fora do workspace
tokio = { version = "1", features = ["time", "macros", "rt-multi-thread"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# o chaveiro do sistema (a chave da Anthropic e a renovação do login do Google)
[target.'cfg(target_os = "macos")'.dependencies.keyring]
version = "3"
features = ["apple-native"]

[target.'cfg(target_os = "windows")'.dependencies.keyring]
version = "3"
features = ["windows-native"]

[target.'cfg(not(any(target_os = "macos", target_os = "windows")))'.dependencies.keyring]
version = "3"

# a fila declara ao macOS uma atividade iniciada pelo usuário (sem isso, com a janela fora da tela, o sistema suspende a
# página e o lote para)
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSProcessInfo", "NSString", "NSObject"] }
