[package]
name = "tauri-plugin-anonimizacao"
version = "0.5.0"
description = "Incognitus como plugin do Tauri: anonimização de PDFs em lote com o motor do Graphé e reidentificação de minutas (o app Incognitus e o módulo do Graphé Desktop)"
edition = "2021"
publish = false
links = "tauri-plugin-anonimizacao"

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ed25519-dalek = "2"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
pdf-writer = "0.12"
subsetter = "0.2"
ttf-parser = "0.25"
flate2 = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
