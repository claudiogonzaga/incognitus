"$schema" = "schemas/schema.json"

[default]
description = "O que a janela do Incognitus usa: a fila de PDFs (pdftotext e OCR), o PDF anonimizado, a reidentificação, o motor e a atualização assinada dele, os Ajustes e o teste de ponta a ponta."
permissions = [
  "allow-info", "allow-info-app", "allow-registrar", "allow-revelar", "allow-ajustes-ler", "allow-ajustes-gravar",
  "allow-preparar-arquivo", "allow-extrair-texto", "allow-ocr-pagina", "allow-limpar-arquivo",
  "allow-gravar-saida", "allow-pasta-padrao", "allow-listar-pdfs", "allow-expandir-caminhos",
  "allow-ler-texto", "allow-docx-partes", "allow-gravar-reidentificado", "allow-gravar-texto",
  "allow-motor-ativo", "allow-motor-checar", "allow-motor-baixar", "allow-motor-instalar", "allow-motor-voltar",
  "allow-e2e-plano", "allow-e2e-gravar", "allow-e2e-fim",
]

# O que o hospedeiro (Graphé Desktop) chama da janela principal dele para ler os autos no MPA: a cópia temporária do PDF,
# o texto, o OCR de uma página, a limpeza e o motor em uso. Nada que grave fora da pasta temporária do módulo.
[[set]]
identifier = "api"
description = "O que o hospedeiro usa para ler os autos: preparar o arquivo, extrair o texto, OCR de página, limpar, e o motor em uso."
permissions = [
  "allow-info",
  "allow-preparar-arquivo", "allow-extrair-texto", "allow-ocr-pagina", "allow-limpar-arquivo",
  "allow-motor-ativo",
]
