"$schema" = "schemas/schema.json"

[default]
description = "O que a janela do Incognitus usa: a fila de PDFs (pdftotext e OCR), o PDF anonimizado, a reidentificação, o motor e a atualização assinada dele, os Ajustes, o teste de ponta a ponta, o 🧠 Melhor Próximo Ato (chave, login do Google, prompt e envio à Anthropic) e o 👁 (o PDF numa janela do app)."
permissions = [
  "allow-info", "allow-info-app", "allow-registrar", "allow-revelar", "allow-ajustes-ler", "allow-ajustes-gravar", "allow-acordado",
  "allow-preparar-arquivo", "allow-extrair-texto", "allow-ocr-pagina", "allow-limpar-arquivo", "allow-texto-documento",
  "allow-gravar-saida", "allow-pasta-padrao", "allow-listar-pdfs", "allow-expandir-caminhos",
  "allow-ler-texto", "allow-docx-partes", "allow-gravar-reidentificado", "allow-gravar-texto",
  "allow-gravar-docx", "allow-abrir-documento", "allow-abrir-modelo", "allow-mesa-ler", "allow-mesa-gravar",
  "allow-motor-ativo", "allow-motor-checar", "allow-motor-baixar", "allow-motor-instalar", "allow-motor-voltar",
  "allow-ner-estado", "allow-ner-baixar", "allow-ner-ler",
  "allow-busca-estado", "allow-busca-baixar", "allow-busca-ler", "allow-modelos-listar", "allow-indice-ler", "allow-indice-gravar",
  "allow-e2e-plano", "allow-e2e-gravar", "allow-e2e-fim",
  "allow-ia-situacao", "allow-ia-chave-guardar", "allow-ia-chave-apagar", "allow-ia-google-entrar", "allow-ia-google-cancelar", "allow-ia-google-sair",
  "allow-ia-prompt-ler", "allow-ia-enviar", "allow-ia-modelos", "allow-ia-pasta-listar", "allow-ia-gdocs-enviar", "allow-cofre-situacao", "allow-cofre-chave-mostrar", "allow-cofre-chave-importar",
  "allow-visor-abrir", "allow-abrir-feedback",
]

# O que o hospedeiro (Graphé Desktop) chama da janela principal dele para ler os autos no MPA: a cópia temporária do PDF,
# o texto, o OCR de uma página, a limpeza e o motor em uso. Nada que grave fora da pasta temporária do módulo.
[[set]]
identifier = "api"
description = "O que o hospedeiro usa para ler os autos: preparar o arquivo, extrair o texto, OCR de página, limpar, e o motor em uso."
permissions = [
  "allow-info",
  "allow-preparar-arquivo", "allow-extrair-texto", "allow-ocr-pagina", "allow-limpar-arquivo",
  "allow-motor-ativo",
]
